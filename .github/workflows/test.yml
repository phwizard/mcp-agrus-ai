name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # `npm install` rather than `npm ci` because Vitest pulls in oxc-parser
        # which has platform-specific optional native deps. Lock files generated
        # on macOS don't always include the Linux variants, so `npm ci` (strict
        # sync check) fails. `npm install` reconciles. Both produce the same
        # node_modules; only the strictness of the sync check differs.
        run: npm install --no-audit --no-fund

      - name: Typecheck (src + api)
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build (compile src to dist for the stdio CLI)
        run: npm run build
